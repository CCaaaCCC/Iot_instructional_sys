# 智慧大棚教学平台 - Mosquitto 云端 Broker 配置
# 安装到 /etc/mosquitto/conf.d/greenhouse.conf
#
# 认证方式：用户名 + 密码（password_file）
# 账号由 deploy/install.sh 创建，与后端 .env 及上位机
# tft_screen_1.9/src/wifi_config.h 中的 MQTT_USERNAME / MQTT_PASSWORD 保持一致。
# 即使启用了密码认证，仍建议在阿里云安全组中把 1883 限制为学校出口 IP。

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
max_connections 100
max_keepalive 120
