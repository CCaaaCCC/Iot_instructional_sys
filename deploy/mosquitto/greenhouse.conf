# 智慧大棚教学平台 - Mosquitto 云端 Broker 配置
# 安装到 /etc/mosquitto/conf.d/greenhouse.conf
#
# 安全提示:
# 当前 ESP32-S3 上位机固件（tft_screen_1.9）以匿名方式连接 MQTT，
# 因此这里保留 allow_anonymous true。务必在阿里云安全组 / ufw 中
# 把 1883 限制为学校出口公网 IP，切勿对所有来源开放。

listener 1883 0.0.0.0
allow_anonymous true
max_connections 100
max_keepalive 120
